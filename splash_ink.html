<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1" name="viewport">
<title>境界 · 片头</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#dcd5c4;
       font-family:"Songti SC","STSong","SimSun",serif}
  .stage{position:relative;width:min(94vw,1080px);aspect-ratio:16/9;border-radius:6px;
         overflow:hidden;
         background:radial-gradient(120% 100% at 50% 42%,#f8f4ec 0%,#f0ebde 58%,#e0d9c6 100%);
         box-shadow:0 30px 80px rgba(40,32,20,.20)}
  svg{width:100%;height:100%;display:block}
  /* 注意：这里刻意不给 .a 设 opacity:0 —— 元素默认必须可见 */
  .a{transform-box:fill-box;transform-origin:50% 50%}
  .chfar,.chnear,.chmain{transform-box:fill-box;transform-origin:50% 50%}

  .vg{animation:fadeIn .7s ease-out both}
  .dot{animation:pop .55s cubic-bezier(.34,1.56,.64,1) both}
  .d1{animation-delay:.30s}.d2{animation-delay:.42s}.d3{animation-delay:.54s}
  .d4{animation-delay:.66s}.d5{animation-delay:.78s}.d6{animation-delay:.90s}
  .m-far{animation:rise .75s ease-out .75s both}
  .m-mid{animation:rise .75s ease-out 1.00s both}
  .m-main{animation:rise .85s ease-out 1.25s both}
  .mist{animation:mistIn 1s ease-out 1.60s both}
  /* 墨晕层用 SVG transform 属性定位 —— 只能做 opacity 动画，
     一旦用 CSS transform 动画会覆盖掉 SVG 的 translate（元素跑到原点）。 */
  .chfar{animation:inkFade 1.15s ease-out 1.40s both}
  .chmid{animation:inkFade 1.1s ease-out 1.52s both}
  .chnear{animation:inkFade 1.05s ease-out 1.64s both}
  .chmain{animation:inkIn .95s cubic-bezier(.22,.9,.3,1) 1.80s both}
  .sun{animation:pop .55s cubic-bezier(.34,1.56,.64,1) 2.45s both}
  .en{animation:fadeNarrow .8s ease-out 2.75s both}

  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.16)}100%{opacity:1;transform:scale(1)}}
  @keyframes mistIn{from{opacity:0;transform:scaleX(.62)}to{opacity:1;transform:none}}
  @keyframes inkIn{0%{opacity:0;transform:scale(1.045)}100%{opacity:1;transform:none}}
  @keyframes inkFade{from{opacity:0}to{opacity:1}}
  @keyframes fadeNarrow{from{opacity:0;transform:scaleX(1.16)}to{opacity:.45;transform:none}}

  .replay{position:absolute;right:18px;bottom:14px;padding:6px 16px;font-size:13px;
          letter-spacing:.22em;color:#1a1a1a;background:transparent;
          border:1px solid rgba(26,26,26,.32);border-radius:999px;cursor:pointer;
          font-family:inherit;opacity:.6;transition:opacity .2s}
  .replay:hover{opacity:1}

  /* 系统开了"减弱动态效果"时，直接给最终画面，不做动画 */
  @media (prefers-reduced-motion: reduce){
    .a,.chfar,.chmid,.chnear,.chmain{animation:none!important;opacity:1!important}
  }
</style>
</head>

<script>
(function(){
  var stage = document.querySelector('.stage');
  var tpl = stage.querySelector('svg').outerHTML;
  var SEL = '.a,.chfar,.chmid,.chnear,.chmain';
  var timer = null;

  /* 兜底：动画时间轴走完后强制定格到最终状态。
     即使 CSS 动画因任何原因失效，画面也绝不会消失。
     只清 animation 与 opacity —— 不动 transform，
     因为墨晕层是用 SVG transform 属性定位的。 */
  function settle(){
    var nodes = stage.querySelectorAll(SEL);
    for (var i = 0; i < nodes.length; i++){
      nodes[i].style.animation = 'none';
      nodes[i].style.opacity = '1';
    }
    timer = null;
  }

  function play(){
    if (timer) { clearTimeout(timer); }
    stage.querySelector('svg').outerHTML = tpl;   /* 重新插入 = 重播 */
    arm();
  }

  function arm(){
    if (timer) { clearTimeout(timer); }
    timer = setTimeout(settle, 3700);
  }

  document.getElementById('rp').addEventListener('click', play);
  arm();

  /* 早期探测：若浏览器根本没调度动画（部分内嵌 WebView / 省电模式会这样），
     立刻点亮，避免用户盯着空白。 */
  setTimeout(function(){
    try {
      var list = document.getAnimations ? document.getAnimations() : [];
      if (!list || list.length === 0) { settle(); }
    } catch (e) { settle(); }
  }, 400);
})();
</script>
