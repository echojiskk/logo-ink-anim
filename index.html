<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1" name="viewport">
<title>镜界 · Logo</title>
<style>
  html,body{margin:0;height:100%;background:#f5f1e8;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  .stage{position:relative;width:min(96vw,1180px);aspect-ratio:16/9}
  .stage svg{width:100%;height:100%;display:block}
  .replay{position:absolute;right:14px;bottom:12px;padding:6px 16px;
    font:14px/1 "KaiTi","STKaiti",serif;letter-spacing:.28em;color:#1a1a1a;
    background:transparent;border:1px solid #1a1a1a;border-radius:0;opacity:.34;
    cursor:pointer;transition:opacity .25s}
  .replay:hover{opacity:.85}

  /* 基础类：绝不设 opacity:0 —— 元素自身值就是终态 */
  .a{}
  /* scale 以元素自身中心为原点（SVG 默认以 viewBox 原点，否则墨点会飞） */
  .mt1,.mt2,.mt3,.mist1,.mist2,.dot{transform-box:fill-box;transform-origin:50% 50%}

  .mt1{animation:rise .70s cubic-bezier(.22,.9,.3,1) .10s both}
  .mt2{animation:rise .70s cubic-bezier(.22,.9,.3,1) .28s both}
  .mt3{animation:rise .80s cubic-bezier(.22,.9,.3,1) .46s both}
  .mist1{animation:mistIn .95s ease-out .66s both}
  .mist2{animation:mistIn .95s ease-out .74s both}
  .d1{animation:dotIn .55s cubic-bezier(.34,1.56,.64,1) .82s both}
  .d2{animation:dotIn .55s cubic-bezier(.34,1.56,.64,1) .88s both}
  .d3{animation:dotIn .55s cubic-bezier(.34,1.56,.64,1) .94s both}
  .d4{animation:dotIn .55s cubic-bezier(.34,1.56,.64,1) 1.00s both}
  .d5{animation:dotIn .55s cubic-bezier(.34,1.56,.64,1) 1.06s both}
  .d6{animation:dotIn .55s cubic-bezier(.34,1.56,.64,1) 1.12s both}
  .d7{animation:dotIn .55s cubic-bezier(.34,1.56,.64,1) 1.18s both}
  /* 洇墨先扩散，主墨后落 —— 字层/落款带 SVG transform，只用 opacity */
  .halo1{animation:inkIn 1.05s ease-out 1.10s both}
  .halo2{animation:inkIn 1.05s ease-out 1.22s both}
  .m1{animation:inkIn .75s cubic-bezier(.22,.9,.3,1) 1.38s both}
  .m2{animation:inkIn .75s cubic-bezier(.22,.9,.3,1) 1.58s both}
  .refl{animation:reflIn 1.10s cubic-bezier(.22,.9,.3,1) 1.85s both}
  .sig{animation:inkIn .85s ease-out 2.15s both}

  /* 只写 from：100% 帧缺省 → 终点自动取元素自身的基础值
     （墨点/洇墨/落款各自的浓度因此被完整保留） */
  @keyframes inkIn{from{opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}}
  @keyframes mistIn{from{opacity:0;transform:scaleX(.55)}}
  @keyframes dotIn{0%{opacity:0;transform:scale(0)}
                   70%{transform:scale(1.22)}
                   100%{transform:scale(1)}}
  @keyframes reflIn{from{opacity:0;transform:translateY(-9px)}}
</style>
</head>

<button class="replay" id="rp">重 播</button>
</div>
<script>
(function(){
  var stage = document.querySelector('.stage');
  var svgEl = stage.querySelector('svg');
  var tpl = svgEl.outerHTML;
  var SEL = '.a,.m1,.m2,.halo1,.halo2,.sig,.refl';
  var timer = null;

  /* 兜底：时间轴走完后强制定格。只清 animation 与 opacity，
     不动 transform —— 字层/倒影层靠 SVG transform 定位，动了会飞走。 */
  function settle(){
    var nodes = stage.querySelectorAll(SEL);
    for (var i = 0; i < nodes.length; i++){
      nodes[i].style.animation = 'none';
      nodes[i].style.opacity = '';      /* 置空 = 回到元素自身的 SVG opacity */
    }
    timer = null;
  }

  function play(){
    if (timer) { clearTimeout(timer); }
    stage.querySelector('svg').outerHTML = tpl;   /* 重新插入 = 重播 */
    arm();
  }

  function arm(){
    if (timer) { clearTimeout(timer); }
    timer = setTimeout(settle, 3400);
  }

  document.getElementById('rp').addEventListener('click', play);
  arm();

  /* 早期探测：若浏览器压根没调度动画（部分 WebView / 省电模式），
     立刻点亮，避免用户盯着空白。 */
  setTimeout(function(){
    try {
      var list = document.getAnimations ? document.getAnimations() : [];
      if (!list || list.length === 0) { settle(); }
    } catch (e) { settle(); }
  }, 400);
})();
</script>
